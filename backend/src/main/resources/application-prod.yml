spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: HikariCP-prod
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate  # prod에서는 절대 update/create 사용 금지
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.myhomepage: INFO

storage:
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    region: ${AWS_REGION:ap-northeast-2}
